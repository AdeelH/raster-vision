[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rastervision_aws_sagemaker"
version = "0.31.2-dev"
description = "A rastervision plugin that adds an AWS SageMaker pipeline runner."
authors = [{ name = "Azavea", email = "info@azavea.com" }]
license = { text = "Apache License 2.0" }
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = [
    "computer-vision",
    "deep-learning",
    "earth-observation",
    "machine-learning",
    "ml",
    "geospatial",
    "geospatial-machine-learning",
    "geospatial-processing",
    "raster",
]
dependencies = [
    "boto3",
    "rastervision_pipeline==0.31.2-dev",
    "sagemaker",
]

[project.urls]
"Homepage" = "https://github.com/azavea/raster-vision"
"GitHub" = "https://github.com/azavea/raster-vision"

[tool.hatch.build.targets.wheel]
packages = ["rastervision"]

[tool.hatch.build.targets.sdist]
only-include = ["rastervision"]

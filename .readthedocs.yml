# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Install all Raster Vision packages and the docs dependencies from uv.lock.
python:
  install:
    - method: uv
      command: sync
      extras: all
      groups:
        - dev
        - docs

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Build documentation with MkDocs
#mkdocs:
#  configuration: mkdocs.yml

# Optionally build your docs in additional formats such as PDF
# Disabled due to: https://github.com/readthedocs/readthedocs.org/issues/10015
# formats:
#   - pdf

# https://docs.readthedocs.io/en/stable/config-file/v2.html#search
search:
  ranking:
    # down-rank source code pages
    _modules/*: -10

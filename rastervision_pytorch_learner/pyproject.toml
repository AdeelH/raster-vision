[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rastervision_pytorch_learner"
version = "0.31.2-dev"
description = "A rastervision plugin that adds PyTorch training pipelines."
authors = [{ name = "Azavea", email = "info@azavea.com" }]
license = { text = "Apache License 2.0" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = [
    "computer-vision",
    "deep-learning",
    "earth-observation",
    "machine-learning",
    "ml",
    "geospatial",
    "geospatial-machine-learning",
    "geospatial-processing",
    "raster",
]
dependencies = [
    "albumentations",
    "cython",
    "matplotlib",
    "numpy",
    "onnx",
    "opencv-python-headless",
    "pillow",
    "psutil",
    "pycocotools",
    "rastervision_core==0.31.2-dev",
    "rastervision_pipeline==0.31.2-dev",
    "tensorboard",
    "torch",
    "torchvision",
    "tqdm",
]

[project.urls]
"Homepage" = "https://github.com/azavea/raster-vision"
"GitHub" = "https://github.com/azavea/raster-vision"

[tool.hatch.build.targets.wheel]
packages = ["rastervision"]

[tool.hatch.build.targets.sdist]
only-include = ["rastervision"]

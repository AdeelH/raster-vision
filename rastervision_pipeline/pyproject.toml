[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rastervision_pipeline"
version = "0.31.2-dev"
description = "The main rastervision package for configuring, defining, and running pipelines."
authors = [{ name = "Azavea", email = "info@azavea.com" }]
license = { text = "Apache License 2.0" }
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = [
    "computer-vision",
    "deep-learning",
    "earth-observation",
    "machine-learning",
    "ml",
    "geospatial",
    "geospatial-machine-learning",
    "geospatial-processing",
    "raster",
]
dependencies = [
    "click",
    "everett",
    "everett[ini]",
    "pydantic>=2",
    "requests",
    "six",
    "tqdm",
]

[project.scripts]
rastervision = "rastervision.pipeline.cli:_main"

[project.urls]
"Homepage" = "https://github.com/azavea/raster-vision"
"GitHub" = "https://github.com/azavea/raster-vision"

[tool.hatch.build.targets.wheel]
packages = ["rastervision"]

[tool.hatch.build.targets.sdist]
only-include = ["rastervision"]

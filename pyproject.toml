[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rastervision"
version = "0.31.2-dev"
description = "An open source framework for deep learning on satellite and aerial imagery."
readme = "README.md"
authors = [{ name = "Azavea", email = "info@azavea.com" }]
license = { text = "Apache License 2.0" }
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = [
    "computer-vision",
    "deep-learning",
    "earth-observation",
    "machine-learning",
    "ml",
    "geospatial",
    "geospatial-machine-learning",
    "geospatial-processing",
    "raster",
]
dependencies = [
    "rastervision_aws_batch==0.31.2-dev",
    "rastervision_aws_s3==0.31.2-dev",
    "rastervision_core==0.31.2-dev",
    "rastervision_pipeline==0.31.2-dev",
    "rastervision_pytorch_backend==0.31.2-dev",
    "rastervision_pytorch_learner==0.31.2-dev",
]

[project.optional-dependencies]
debugging = []
full = ["rastervision_aws_sagemaker==0.31.2-dev"]

[project.urls]
"Homepage" = "https://github.com/azavea/raster-vision"
"GitHub" = "https://github.com/azavea/raster-vision"

[dependency-groups]
dev = [
    "awscli==1.33.40",
    "coverage==7.2.0",
    "jupyter_contrib_nbextensions==0.7.0",
    "jupyter==1.0.0",
    "jupyterlab==4.2.5",
    "moto[s3]==5.0.5",
    "pyright[nodejs]==1.1.414",
    "pystac_client==0.8.3",
    "ruff==0.17.4",
    "seaborn==0.13.2",
    "sphinx-autobuild==2021.3.14",
]
docs = [
    "autodoc-pydantic==2.2.0",
    "furo==2022.9.29",
    # Needed to make syntax highlighting work correctly on readthedocs.
    # See https://github.com/spatialaudio/nbsphinx/issues/24.
    "ipython>=8.26.0",
    "myst-parser==0.18.1",
    "nbsphinx==0.8.9",
    "sphinx-copybutton==0.5.*",
    # update when this is resolved: https://github.com/spatialaudio/nbsphinx/issues/655
    "sphinx-gallery>=0.10,<0.11",
    "sphinx==5.3.0",
]
# Extra packages installed only in the Docker image.
docker = [
    # onnxruntime-gpu 1.19 is built against CUDA 12, matching the base image.
    "onnxruntime-gpu==1.19.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pip",
]

[tool.uv]
default-groups = ["dev"]
# The lockfile pins the dependency versions that the test suite currently
# passes with. Several of these (e.g. numpy 1.26, rasterio 1.3) do not have
# wheels for Python 3.13+, so the lock is restricted to Python < 3.13 (and
# >= 3.11 via requires-python). Widen this when upgrading the locked
# dependencies.
environments = ["python_version < '3.13'"]
constraint-dependencies = [
    # rasterio only ships Linux ARM64 wheels from 1.4.4 onwards; older versions
    # would have to be compiled against a system GDAL on that platform.
    "rasterio>=1.4.4 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.workspace]
members = ["rastervision_*"]

[tool.uv.sources]
rastervision_aws_batch = { workspace = true }
rastervision_aws_s3 = { workspace = true }
rastervision_aws_sagemaker = { workspace = true }
rastervision_core = { workspace = true }
rastervision_pipeline = { workspace = true }
rastervision_pytorch_backend = { workspace = true }
rastervision_pytorch_learner = { workspace = true }

# The top-level package is a metapackage with no code of its own.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "LICENSE"]

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = [
    "cookiecutter_template",
    "data",
    "docs",
    "**/tfod_utils",
    ".history",
    "*.ipynb",
    "*.md",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Only the basic pycodestyle (E, W) and pyflakes (F) rules.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Re-exports
"__init__.py" = ["F401", "F403", "F405", "E402", "E501"]

[tool.ruff.lint.pycodestyle]
max-line-length = 90

[tool.pyright]
typeCheckingMode = "basic"
# The codebase predates type checking. These rules, which check type
# compatibility rather than e.g. undefined names, wrong imports, or calls that
# are certain to fail, are disabled until the type annotations are cleaned up.
reportArgumentType = false
reportAssignmentType = false
reportReturnType = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalOperand = false
pythonVersion = "3.11"
include = ["rastervision_*", "tests", "integration_tests"]
# Resolve the workspace packages as local source rather than as installed
# (py.typed) libraries.
extraPaths = [
    "rastervision_aws_batch",
    "rastervision_aws_s3",
    "rastervision_aws_sagemaker",
    "rastervision_core",
    "rastervision_pipeline",
    "rastervision_pytorch_backend",
    "rastervision_pytorch_learner",
]
exclude = [
    "**/cookiecutter_template",
    "**/tfod_utils",
    # Legacy scripts that are known to be broken (they use the pre-0.20 API).
    "**/cowc_potsdam_data_prep",
    "integration_tests/util/generate_scene.py",
    "**/.history",
    "**/__pycache__",
    "**/build",
    "**/.venv",
]

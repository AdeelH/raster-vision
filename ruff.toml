target-version = "py310"
line-length = 79
extend-exclude = [
    '.history/',
    '*.git*',
    '*.history*',
    '**/*.ipynb',
    '**/conf.py',
    '**/setup.py',
    '*build*',
    '*cookiecutter_template*',
    '*tfod_utils*',
    'data/*',
    'docs/usage/tutorials/notebooks/',
]

[lint.pydocstyle]
convention = 'google'

[lint]
# http://docs.astral.sh/ruff/rules/
select = ['ALL']
ignore = [
    # Unnecessary assignment before return statement
    'RET504',
    # Trailing comma missing
    'COM812',
    # Missing docstring for module
    'D100',
    # Missing docstring in magic method
    'D105',
    # 1 blank line required before class docstring
    'D203',
    # Multi-line docstring summary should start at the second line
    'D213',
    # `os.path.join()` should be replaced by `Path` with `/` operator
    'PTH118',
    # Avoid using the generic variable name `df` for DataFrames
    'PD901',
    # avoid long exception messages
    'TRY003',
    # assign exception message to variable first
    'EM101',
    # exception must not use f-string
    'EM102',
    # logging statement uses f-string
    'G004',
    # use of assert detected
    'S101',
    # use single if statement instead of nesting
    'SIM102',
    # first docstring line should end with period
    "D415",
    # for loop variable overwritten
    "PLW2901",
    # missing type annotation for *args
    "ANN002",
    # missing type annotation for *kwargs
    "ANN003",
    # found commented-out code (this often generates false positives)
    "ERA001",
    # too complex
    "C901",
    # too many branches
    "PLR0912",
    # too many arguments
    "PLR0913",
    # too many statements
    "PLR0915",
    # Path related checks
    "PTH",
    # missing docstring in public method
    "D102",
    # lowercase imported as uppercase (complains about import torch.nn.functional as F)
    "N812",
]

[lint.per-file-ignores]
'*/**/__init__.py' = [
    # Module level import not at top of cell
    'E402',
    # Imported but unused
    'F401',
]
'tests/**/*' = [
    # Use of assert detected
    'S101',
    # Missing return type annotation for public function
    'ANN201',
    # Missing docstrings
    'D1',
    # Private member accessed
    'SLF001',
    # magic values
    'PLR2004',
    # flake8-pytest-style
    'PT',
]

[lint.flake8-quotes]
inline-quotes = "single"

[format]
quote-style = 'single'
indent-style = 'space'
# False means: respect magic trailing commas i.e. don't collapse lines.
skip-magic-trailing-comma = false
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = 'dynamic'

[lint.isort]
known-first-party = ['rastervision']
